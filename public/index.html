<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tabTitle">10-Min TrashMail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <style>
        body { background: #05070a; color: white; font-family: sans-serif; background-image: radial-gradient(circle at 50% -20%, #1e293b 0%, #05070a 100%); }
        .glow-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen">
    <header class="p-6 flex justify-between items-center max-w-4xl mx-auto">
        <h1 id="brandName" class="text-xl font-bold text-emerald-500">TRASHMAIL</h1>
        <div class="text-[10px] bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/20">LIVE</div>
    </header>

    <div id="topAd" class="max-w-xl mx-auto px-4 overflow-hidden"></div>

    <main class="max-w-xl mx-auto px-4 mt-6 space-y-6">
        <div class="glow-card rounded-3xl p-8 text-center">
            <div id="countdown" class="text-6xl font-bold text-emerald-500 mb-6">10:00</div>
            <input type="text" id="emailBox" readonly class="w-full bg-black/40 border border-white/5 p-5 rounded-2xl text-center text-emerald-100 mb-4" value="Connecting...">
            <div class="grid grid-cols-2 gap-3">
                <button onclick="copyEmail()" class="col-span-2 bg-emerald-500 text-black font-bold py-4 rounded-2xl">COPY ADDRESS</button>
                <button onclick="extendTime()" class="bg-white/5 py-4 rounded-2xl text-sm">+10 Min</button>
                <button onclick="initEmail()" class="bg-red-500/10 text-red-400 py-4 rounded-2xl text-sm">New Address</button>
            </div>
        </div>

        <div id="bottomAd" class="max-w-xl mx-auto overflow-hidden"></div>

        <section class="space-y-4 pb-10">
            <h2 class="text-xs font-bold text-gray-500 uppercase tracking-widest px-2">Inbox</h2>
            <div id="inbox" class="space-y-3 text-center py-10 bg-white/5 rounded-3xl border border-dashed border-white/10 text-gray-500 text-sm">
                Waiting for messages...
            </div>
        </section>
    </main>

    <div id="modal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-xl z-50 flex items-center justify-center p-4">
        <div class="w-full max-w-2xl bg-[#0f172a] rounded-3xl overflow-hidden border border-white/10">
            <div class="p-6 border-b border-white/5 flex justify-between items-center"><h3 id="mSub" class="font-bold text-emerald-400"></h3><button onclick="closeM()">&times;</button></div>
            <div id="mBody" class="p-8 h-[60vh] overflow-y-auto text-gray-300"></div>
        </div>
    </div>

    <script>
        let currentEmail = ""; let expiryTime = 0;
        const msgSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

        async function initEmail() {
            const res = await fetch('/api/generate');
            const data = await res.json();
            currentEmail = data.email;
            expiryTime = Date.now() + 600000;
            document.getElementById('emailBox').value = currentEmail;
            document.getElementById('brandName').innerText = data.siteName;
            document.getElementById('tabTitle').innerText = data.siteName;
            document.getElementById('topAd').innerHTML = data.adTop || '';
            document.getElementById('bottomAd').innerHTML = data.adBottom || '';
            startTimer();
            startPolling();
        }

        function startTimer() {
            clearInterval(window.tInt);
            window.tInt = setInterval(() => {
                const diff = expiryTime - Date.now();
                if(diff <= 0) initEmail();
                const m = Math.floor(diff/60000); const s = Math.floor((diff%60000)/1000);
                document.getElementById('countdown').innerText = `${m}:${s < 10 ? '0'+s : s}`;
            }, 1000);
        }

        async function checkInbox() {
            const res = await fetch(`/api/inbox?email=${encodeURIComponent(currentEmail)}&t=${Date.now()}`);
            const msgs = await res.json();
            if(msgs.length > 0) {
                document.getElementById('inbox').innerHTML = msgs.map(m => `
                    <div onclick='openM(${JSON.stringify(m).replace(/'/g, "&apos;")})' class="glow-card p-5 rounded-2xl cursor-pointer border border-white/5 mb-3">
                        <div class="flex justify-between font-bold text-emerald-400 text-sm"><span>${m.from}</span></div>
                        <div class="text-sm text-gray-200 truncate mt-1">${m.subject}</div>
                    </div>
                `).join('');
                msgSound.play();
            }
        }

        function openM(m) { document.getElementById('mSub').innerText = m.subject; document.getElementById('mBody').innerHTML = DOMPurify.sanitize(m.body || m.html); document.getElementById('modal').classList.remove('hidden'); }
        function closeM() { document.getElementById('modal').classList.add('hidden'); }
        function copyEmail() { navigator.clipboard.writeText(currentEmail); alert("Copied!"); }
        function extendTime() { expiryTime += 600000; }
        function startPolling() { setInterval(checkInbox, 5000); }

        initEmail();
    </script>
</body>
</html>
