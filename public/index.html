<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tabTitle">TrashMail | Loading...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #10b981; --bg: #020408; }
        body { 
            background: var(--bg); color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif;
            background-image: radial-gradient(circle at 50% -10%, #111827 0%, transparent 50%);
            background-attachment: fixed;
        }
        .premium-card { background: rgba(13, 17, 23, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
        .timer-text { font-size: clamp(3rem, 15vw, 5rem); font-weight: 800; background: linear-gradient(180deg, #fff 0%, #10b981 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.3)); }
        .btn-glow { background: linear-gradient(135deg, #10b981 0%, #059669 100%); box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2); transition: 0.3s; }
        .btn-glow:active { transform: scale(0.95); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .animate-live { animation: pulse 2s infinite; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">

    <!-- Announcement Bar -->
    <div id="announceBar" class="hidden w-full bg-emerald-500/20 border-b border-emerald-500/30 p-3 text-center text-xs font-bold text-emerald-400"></div>

    <!-- Header -->
    <header class="w-full max-w-5xl p-6 md:p-10 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img id="siteLogo" src="" class="w-10 h-10 rounded-xl hidden border border-white/10 object-cover">
            <div>
                <h1 id="brandName" class="text-2xl font-black text-white tracking-tighter uppercase">TRASHMAIL</h1>
                <p id="siteDesc" class="text-[10px] text-gray-500 font-bold tracking-widest uppercase"></p>
            </div>
        </div>
        <div class="flex items-center gap-2 bg-emerald-500/10 px-4 py-2 rounded-full border border-emerald-500/20">
            <span class="w-2 h-2 bg-emerald-500 rounded-full animate-live shadow-[0_0_10px_#10b981]"></span>
            <span class="text-[10px] font-black text-emerald-500 uppercase tracking-widest">Live</span>
        </div>
    </header>

    <main class="w-full max-w-xl px-4 space-y-6">
        <!-- Top Ad -->
        <div id="adT" class="w-full overflow-hidden rounded-2xl"></div>

        <!-- Main Timer Card -->
        <div class="premium-card rounded-[2.5rem] p-10 text-center relative overflow-hidden">
            <div id="countdown" class="timer-text mb-2">10:00</div>
            <p class="text-gray-500 text-[10px] font-bold uppercase tracking-[0.3em] mb-10">Waiting for sync...</p>

            <div class="space-y-4">
                <input type="text" id="emailBox" readonly class="w-full bg-black/40 border border-white/5 p-6 rounded-2xl text-center text-xl text-emerald-400 font-bold outline-none" value="Connecting to Vault...">
                
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="copyEmail()" class="btn-glow col-span-2 text-black font-black py-5 rounded-2xl text-sm uppercase tracking-wider">COPY ADDRESS</button>
                    <button onclick="initEmail()" class="bg-white/5 py-4 rounded-2xl text-sm font-bold border border-white/5 hover:bg-white/10 transition-all">New Address</button>
                    <button onclick="extendTime()" class="bg-white/5 py-4 rounded-2xl text-sm font-bold border border-white/5 text-emerald-500 hover:bg-white/10 transition-all">+10 Min</button>
                </div>
            </div>
        </div>

        <!-- Bottom Ad -->
        <div id="adB" class="w-full overflow-hidden rounded-2xl"></div>

        <!-- Inbox Section -->
        <section class="space-y-4 pb-20">
            <div class="flex justify-between items-center px-4">
                <h3 class="text-[10px] font-black uppercase tracking-[0.3em] text-gray-500">Secure Inbox</h3>
                <span id="pollStatus" class="text-[9px] text-emerald-500 font-bold italic animate-pulse">Syncing...</span>
            </div>
            <div id="inbox" class="space-y-3">
                <div class="premium-card rounded-3xl p-16 text-center border-dashed border-white/10">
                    <p class="text-gray-500 text-sm font-medium">Listening for incoming messages...</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="w-full max-w-4xl py-10 text-center border-t border-white/5 mt-auto">
        <p id="footerText" class="text-[10px] text-gray-700 font-bold uppercase tracking-[0.4em]"></p>
    </footer>

    <!-- Message Reader Modal -->
    <div id="modal" class="hidden fixed inset-0 bg-black/95 backdrop-blur-2xl z-50 flex items-center justify-center p-4">
        <div class="w-full max-w-3xl premium-card rounded-[2.5rem] overflow-hidden flex flex-col max-h-[85vh]">
            <div class="p-8 border-b border-white/5 flex justify-between items-center bg-white/5">
                <div class="overflow-hidden">
                    <h4 id="mSub" class="text-xl font-black text-emerald-400 truncate pr-4"></h4>
                    <p id="mFrom" class="text-[10px] text-gray-500 font-bold uppercase mt-1"></p>
                </div>
                <button onclick="closeM()" class="w-12 h-12 rounded-2xl bg-white/5 flex items-center justify-center text-2xl hover:bg-red-500/20 hover:text-red-500 transition-all">&times;</button>
            </div>
            <div id="mBody" class="p-10 overflow-y-auto text-gray-300 leading-relaxed text-lg flex-1"></div>
        </div>
    </div>

    <script>
        let currentEmail = "";
        let expiryTime = 0;
        let lastMsgCount = 0;
        const msgSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

        // ১. শুরুতেই ডেটা লোড করা
        async function initEmail() {
            try {
                document.getElementById('emailBox').value = "Generating Address...";
                const res = await fetch('/api/generate');
                const data = await res.json();
                
                // Fallback Logic: undefined আসলে ডিফল্ট লেখা দেখাবে
                const siteName = data.siteName || "10-MIN TRASHMAIL";
                currentEmail = data.email || "establishing@cybertemp.xyz";
                
                document.getElementById('brandName').innerText = siteName;
                document.getElementById('tabTitle').innerText = siteName;
                document.getElementById('siteDesc').innerText = data.description || "Disposable Email Service";
                document.getElementById('footerText').innerText = data.footerText || "© 2024 Premium TrashMail";
                document.getElementById('emailBox').value = currentEmail;

                // Announcement
                if(data.showAnnouncement && data.announcement) {
                    document.getElementById('announceBar').innerText = data.announcement;
                    document.getElementById('announceBar').classList.remove('hidden');
                } else {
                    document.getElementById('announceBar').classList.add('hidden');
                }

                // Logo
                if(data.logoUrl) {
                    const logoImg = document.getElementById('siteLogo');
                    logoImg.src = data.logoUrl;
                    logoImg.classList.remove('hidden');
                }

                // Ads
                document.getElementById('adT').innerHTML = data.adTop || '';
                document.getElementById('adB').innerHTML = data.adBottom || '';

                expiryTime = Date.now() + 600000;
                startTimer();
                lastMsgCount = 0; 
            } catch (e) {
                console.error("Init Error:", e);
                document.getElementById('emailBox').value = "Connection Error. Refresh.";
            }
        }

        // ২. টাইমার কন্ট্রোল
        function startTimer() {
            clearInterval(window.tInt);
            window.tInt = setInterval(() => {
                const diff = expiryTime - Date.now();
                if(diff <= 0) { initEmail(); return; }
                const m = Math.floor(diff/60000);
                const s = Math.floor((diff%60000)/1000);
                document.getElementById('countdown').innerText = `${m}:${s < 10 ? '0'+s : s}`;
            }, 1000);
        }

        // ৩. ইনবক্স চেক করা
        async function checkInbox() {
            if(!currentEmail) return;
            try {
                const res = await fetch(`/api/inbox?email=${encodeURIComponent(currentEmail)}&t=${Date.now()}`);
                const msgs = await res.json();
                
                if(msgs && Array.isArray(msgs) && msgs.length > 0) {
                    renderMessages(msgs);
                    if(msgs.length > lastMsgCount) {
                        msgSound.play().catch(()=>{});
                        lastMsgCount = msgs.length;
                    }
                }
            } catch (e) {
                console.log("Polling failed...");
            }
        }

        // ৪. মেসেজ রেন্ডার করা
        function renderMessages(messages) {
            const container = document.getElementById('inbox');
            container.innerHTML = messages.map(msg => `
                <div onclick='openM(${JSON.stringify(msg).replace(/'/g, "&apos;")})' 
                     class="premium-card rounded-2xl p-6 cursor-pointer border-l-4 border-emerald-500 hover:bg-white/5 transition-all">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-emerald-400 font-extrabold text-[10px] uppercase tracking-widest">${msg.from.split('<')[0]}</span>
                        <span class="text-[9px] text-gray-500 font-bold">RECEIVED</span>
                    </div>
                    <div class="text-white font-bold truncate">${msg.subject || '(No Subject)'}</div>
                </div>
            `).join('');
        }

        // ৫. মেসেজ রিডার
        function openM(msg) {
            document.getElementById('mSub').innerText = msg.subject || '(No Subject)';
            document.getElementById('mFrom').innerText = `From: ${msg.from}`;
            document.getElementById('mBody').innerHTML = DOMPurify.sanitize(msg.body || msg.html || 'No content.');
            document.getElementById('modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeM() {
            document.getElementById('modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // ৬. কপি এবং অন্যান্য
        function copyEmail() {
            navigator.clipboard.writeText(currentEmail);
            const input = document.getElementById('emailBox');
            const original = input.value;
            input.value = "COPIED TO CLIPBOARD!";
            setTimeout(() => input.value = original, 2000);
        }

        function extendTime() {
            expiryTime += 600000;
        }

        // ৭. অটোমেটিক ইনবক্স চেক (৫ সেকেন্ড)
        setInterval(checkInbox, 5000);
        
        // শুরু করা
        window.onload = initEmail;
    </script>
</body>
</html>
