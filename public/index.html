<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-Min TrashMail | Fast & Secure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { background: #05070a; color: #f8fafc; font-family: 'Space Grotesk', sans-serif; background-image: radial-gradient(circle at 50% -20%, #1e293b 0%, #05070a 100%); }
        .glow-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .btn-green { background: linear-gradient(135deg, #10b981 0%, #059669 100%); transition: all 0.2s ease; }
        .btn-green:active { transform: scale(0.95); }
        .refresh-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen">

    <header class="p-6 flex justify-between items-center max-w-4xl mx-auto">
        <h1 class="text-xl font-bold tracking-tighter">TRASH<span class="text-emerald-500">MAIL</span></h1>
        <div class="flex items-center gap-2 text-[10px] text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/20">
            <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span> SYSTEM ACTIVE
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 mt-4 space-y-6">
        
        <!-- Timer & Email -->
        <div class="glow-card rounded-3xl p-8 text-center">
            <div id="countdown" class="text-6xl font-bold text-emerald-500 mb-6 tracking-tighter">10:00</div>
            <div class="space-y-4">
                <input type="text" id="emailBox" readonly value="Syncing API..." 
                    class="w-full bg-black/40 border border-white/5 p-5 rounded-2xl text-center text-lg text-emerald-100 focus:outline-none transition-all">
                
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="copyEmail()" class="btn-green col-span-2 text-black font-bold py-4 rounded-2xl">COPY ADDRESS</button>
                    <button onclick="extendTime()" class="bg-white/5 py-4 rounded-2xl text-sm">+10 Min</button>
                    <button onclick="initEmail()" class="bg-red-500/10 text-red-400 py-4 rounded-2xl text-sm">New Address</button>
                </div>
            </div>
        </div>

        <!-- Inbox Section -->
        <section class="space-y-4">
            <div class="flex justify-between items-center px-2">
                <h2 class="text-xs font-bold text-gray-500 uppercase tracking-widest">Inbox</h2>
                <button onclick="checkInbox()" id="refreshBtn" class="p-2 bg-emerald-500/10 rounded-full text-emerald-500 hover:bg-emerald-500/20 transition-all">
                    <svg id="refreshIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
                </button>
            </div>

            <div id="inbox" class="space-y-3">
                <div class="text-center py-16 bg-white/[0.02] rounded-3xl border border-dashed border-white/5">
                    <p class="text-gray-500 text-sm">No messages yet. Waiting...</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Reader Modal -->
    <div id="modal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-xl z-50 flex items-center justify-center p-4">
        <div class="w-full max-w-2xl bg-[#0f172a] rounded-3xl overflow-hidden border border-white/10">
            <div class="p-6 border-b border-white/5 flex justify-between items-center bg-white/5">
                <h3 id="modalSubject" class="font-bold text-emerald-400 truncate"></h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center">&times;</button>
            </div>
            <div id="modalBody" class="p-8 h-[60vh] overflow-y-auto text-gray-300"></div>
        </div>
    </div>

    <script>
        let currentEmail = localStorage.getItem('tm_addr') || "";
        let expiryTime = parseInt(localStorage.getItem('tm_exp')) || 0;
        let lastMsgCount = 0;
        const msgSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

        async function initEmail() {
            document.getElementById('emailBox').value = "Connecting...";
            const res = await fetch('/api/generate');
            const data = await res.json();
            currentEmail = data.email;
            expiryTime = Date.now() + 600000;
            localStorage.setItem('tm_addr', currentEmail);
            localStorage.setItem('tm_exp', expiryTime);
            renderUI();
            checkInbox();
        }

        function renderUI() {
            document.getElementById('emailBox').value = currentEmail;
            clearInterval(window.tInt);
            window.tInt = setInterval(() => {
                const diff = expiryTime - Date.now();
                if (diff <= 0) { initEmail(); return; }
                const m = Math.floor(diff / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                document.getElementById('countdown').innerText = `${m}:${s < 10 ? '0'+s : s}`;
            }, 1000);
        }

        async function checkInbox() {
            if(!currentEmail) return;
            const icon = document.getElementById('refreshIcon');
            icon.classList.add('refresh-spin');
            
            try {
                // Cache-buster (?t=...) যোগ করা হয়েছে যাতে ব্রাউজার পুরনো ডাটা না দেখায়
                const res = await fetch(`/api/inbox?email=${encodeURIComponent(currentEmail)}&t=${Date.now()}`);
                const messages = await res.json();
                
                if(messages.length > lastMsgCount) {
                    msgSound.play(); // নতুন মেসেজ আসলে সাউন্ড হবে
                    renderMessages(messages);
                }
                lastMsgCount = messages.length;
            } catch (e) {}
            
            setTimeout(() => icon.classList.remove('refresh-spin'), 1000);
        }

        function renderMessages(messages) {
            const container = document.getElementById('inbox');
            container.innerHTML = messages.map(msg => `
                <div onclick='openMessage(${JSON.stringify(msg).replace(/'/g, "&apos;")})' 
                     class="glow-card p-5 rounded-2xl cursor-pointer border border-white/5 hover:border-emerald-500/50 transition-all">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-emerald-400 font-bold text-sm">${msg.from}</span>
                        <span class="text-[9px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full font-bold">NEW</span>
                    </div>
                    <div class="text-sm text-gray-200 font-medium truncate">${msg.subject || 'No Subject'}</div>
                </div>
            `).join('');
        }

        function openMessage(msg) {
            document.getElementById('modalSubject').innerText = msg.subject;
            document.getElementById('modalBody').innerHTML = DOMPurify.sanitize(msg.body || msg.html || 'Empty');
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        function copyEmail() {
            navigator.clipboard.writeText(currentEmail);
            alert("Email Copied!");
        }

        function extendTime() {
            expiryTime += 600000;
            localStorage.setItem('tm_exp', expiryTime);
        }

        // অটোমেটিক ৫ সেকেন্ড পর পর চেক করবে
        setInterval(checkInbox, 5000);

        if (currentEmail && expiryTime > Date.now()) { renderUI(); checkInbox(); } 
        else { initEmail(); }
    </script>
</body>
</html>
