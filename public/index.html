<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-Min TrashMail | Privacy Protected</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <style>
        body { background-color: #1a1c23; color: #e5e7eb; }
        .ad-slot { background: #242631; border: 1px dashed #374151; display: flex; align-items: center; justify-content: center; min-height: 90px; }
        .glass-card { background: #242631; border: 1px solid #2d2f39; }
    </style>
</head>
<body class="min-h-screen">
    <nav class="p-4 border-b border-gray-800">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-emerald-500 italic">10-MIN <span class="text-white">TRASHMAIL</span></h1>
            <span class="text-[10px] bg-emerald-500/10 text-emerald-500 px-2 py-1 rounded">Vercel Edge Active</span>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto p-4"><div class="ad-slot w-full rounded-lg text-gray-600 text-xs">ADVERTISEMENT (728x90)</div></div>

    <main class="max-w-2xl mx-auto p-4 space-y-6">
        <div class="glass-card rounded-2xl p-8 text-center space-y-6 shadow-2xl">
            <div id="countdown" class="text-6xl font-mono font-bold text-emerald-500 tracking-tighter">10:00</div>
            <div class="relative group">
                <input type="text" id="emailBox" readonly value="Allocating address..." 
                    class="w-full bg-[#1a1c23] border border-gray-700 p-5 rounded-xl text-center text-lg font-mono focus:outline-none">
                <button onclick="copyEmail()" class="mt-4 w-full bg-emerald-500 hover:bg-emerald-600 text-gray-900 py-4 rounded-xl font-bold transition-all transform active:scale-95">
                    COPY EMAIL ADDRESS
                </button>
            </div>
            <div class="flex gap-3">
                <button onclick="extendTime()" class="flex-1 bg-gray-700 py-3 rounded-xl text-sm font-semibold hover:bg-gray-600">+10 Min</button>
                <button onclick="initEmail()" class="flex-1 bg-red-900/20 text-red-400 border border-red-900/50 py-3 rounded-xl text-sm font-semibold hover:bg-red-900/40">New Address</button>
            </div>
        </div>

        <div class="ad-slot w-full h-[250px] rounded-lg text-gray-600 text-xs">ADVERTISEMENT (300x250)</div>

        <section class="space-y-4">
            <h2 class="text-gray-500 font-bold uppercase text-xs tracking-widest px-1">Inbox</h2>
            <div id="inbox" class="space-y-3">
                <div class="text-center py-12 text-gray-600 animate-pulse">Waiting for messages...</div>
            </div>
        </section>
    </main>

    <!-- Content Modal -->
    <div id="modal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-md z-50 p-4">
        <div class="max-w-3xl mx-auto bg-white rounded-2xl h-[85vh] flex flex-col mt-4 overflow-hidden">
            <div class="p-4 bg-[#242631] text-white flex justify-between items-center">
                <span id="modalSubject" class="font-bold truncate"></span>
                <button onclick="closeModal()" class="text-2xl leading-none">&times;</button>
            </div>
            <div id="modalBody" class="p-6 overflow-y-auto text-black flex-1"></div>
        </div>
    </div>

    <script>
        let currentEmail = localStorage.getItem('trash_mail_address') || "";
        let expiryTime = parseInt(localStorage.getItem('trash_mail_expiry')) || 0;
        let pollTimer = null;

        async function initEmail() {
            document.getElementById('emailBox').value = "Generating...";
            const res = await fetch('/api/generate');
            const data = await res.json();
            currentEmail = data.email;
            expiryTime = Date.now() + 600000;
            
            localStorage.setItem('trash_mail_address', currentEmail);
            localStorage.setItem('trash_mail_expiry', expiryTime);
            
            updateUI();
            startPolling();
        }

        function updateUI() {
            document.getElementById('emailBox').value = currentEmail;
            startTimer();
        }

        function startTimer() {
            clearInterval(window.timerInt);
            window.timerInt = setInterval(() => {
                const diff = expiryTime - Date.now();
                if (diff <= 0) { initEmail(); return; }
                const m = Math.floor(diff / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                document.getElementById('countdown').innerText = `${m}:${s < 10 ? '0'+s : s}`;
            }, 1000);
        }

        function extendTime() {
            expiryTime = Math.min(expiryTime + 600000, Date.now() + 1200000);
            localStorage.setItem('trash_mail_expiry', expiryTime);
        }

        async function checkInbox() {
            if(!currentEmail) return;
            try {
                const res = await fetch(`/api/inbox?email=${encodeURIComponent(currentEmail)}`);
                const emails = await res.json();
                if (emails.length > 0) renderInbox(emails);
            } catch (e) {}
        }

        function renderInbox(emails) {
            const container = document.getElementById('inbox');
            container.innerHTML = emails.map(email => `
                <div onclick='openEmail(${JSON.stringify(email).replace(/'/g, "&apos;")})' 
                     class="glass-card p-5 rounded-xl cursor-pointer hover:border-emerald-500 border-transparent border transition-all">
                    <div class="flex justify-between items-start">
                        <span class="font-bold text-emerald-400">${email.from}</span>
                        <span class="text-[10px] text-gray-500 font-mono">RECEIVED</span>
                    </div>
                    <div class="text-sm text-gray-300 mt-1">${email.subject}</div>
                </div>
            `).join('');
        }

        function openEmail(email) {
            document.getElementById('modalSubject').innerText = email.subject;
            document.getElementById('modalBody').innerHTML = DOMPurify.sanitize(email.body || email.html);
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        function copyEmail() {
            navigator.clipboard.writeText(currentEmail);
            alert("Email Copied!");
        }

        function startPolling() {
            clearInterval(pollTimer);
            checkInbox();
            pollTimer = setInterval(checkInbox, 5000);
        }

        if (currentEmail && expiryTime > Date.now()) {
            updateUI();
            startPolling();
        } else {
            initEmail();
        }
    </script>
</body>
  </html>
