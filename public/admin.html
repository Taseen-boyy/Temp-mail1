<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Master Hub | TrashMail Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; color: white; }
        .box { background: #0f172a; border: 1px solid #1e293b; padding: 25px; border-radius: 20px; }
        input, textarea, select { background: #1e293b; border: 1px solid #334155; padding: 12px; border-radius: 10px; width: 100%; color: white; margin-top: 5px; outline: none; }
        input:focus { border-color: #10b981; }
        label { font-size: 11px; color: #64748b; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body class="p-6 pb-20">
    <div id="login" class="max-w-md mx-auto mt-20 box text-center">
        <h1 class="text-2xl font-bold mb-4 text-emerald-500">Admin Hub</h1>
        <input type="password" id="pass" placeholder="Password" class="mb-4 text-center">
        <button onclick="login()" class="w-full bg-emerald-500 text-black font-bold py-4 rounded-xl">UNLOCK DASHBOARD</button>
    </div>

    <div id="dash" class="hidden max-w-5xl mx-auto space-y-6">
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-bold uppercase tracking-tighter">System <span class="text-emerald-500">Master</span></h1>
            <button onclick="save()" class="bg-emerald-500 text-black px-12 py-4 rounded-xl font-bold">SAVE ALL CHANGES</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="box space-y-4 border-t-4 border-emerald-500">
                <h3 class="font-bold text-emerald-500 text-xs">SITE IDENTITY</h3>
                <div><label>Site Name</label><input type="text" id="siteName"></div>
                <div><label>Site Description</label><input type="text" id="desc"></div>
                <div><label>Logo URL</label><input type="text" id="logo"></div>
                <div><label>Footer Text</label><input type="text" id="footer"></div>
            </div>

            <div class="box space-y-4 border-t-4 border-blue-500">
                <h3 class="font-bold text-blue-500 text-xs">BACKEND CONFIG</h3>
                <div><label>API Keys (One Per Line)</label><textarea id="keys" rows="4"></textarea></div>
                <div><label>Maintenance Mode</label><select id="maint"><option value="false">OFF (Live)</option><option value="true">ON (System Blocked)</option></select></div>
            </div>

            <div class="box md:col-span-2 space-y-4 border-t-4 border-purple-500">
                <h3 class="font-bold text-purple-500 text-xs">ANNOUNCEMENT</h3>
                <div><label>Message</label><input type="text" id="ann"></div>
                <div><label>Visibility</label><select id="sAnn"><option value="false">Hidden</option><option value="true">Visible</option></select></div>
            </div>

            <div class="box md:col-span-2 space-y-4 border-t-4 border-orange-500">
                <h3 class="font-bold text-orange-500 text-xs">ADVERTISING (HTML CODE)</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label>Top Ad HTML (AdSense/Adsterra)</label><textarea id="adT" rows="4"></textarea></div>
                    <div><label>Bottom Ad HTML</label><textarea id="adB" rows="4"></textarea></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let p = "";
        async function login() {
            p = document.getElementById('pass').value;
            const res = await fetch('/api/admin/config', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ password: p, action: 'get' }) });
            if(res.ok) {
                const d = await res.json();
                document.getElementById('login').classList.add('hidden'); document.getElementById('dash').classList.remove('hidden');
                document.getElementById('siteName').value = d.siteName; document.getElementById('desc').value = d.description;
                document.getElementById('logo').value = d.logoUrl; document.getElementById('footer').value = d.footerText;
                document.getElementById('keys').value = (d.apiKeys || []).join('\n'); document.getElementById('ann').value = d.announcement;
                document.getElementById('sAnn').value = d.showAnnouncement.toString(); document.getElementById('maint').value = d.maintenance.toString();
                document.getElementById('adT').value = d.adTop; document.getElementById('adB').value = d.adBottom;
            } else { alert("Wrong Password!"); }
        }
        async function save() {
            const data = {
                siteName: document.getElementById('siteName').value,
                description: document.getElementById('desc').value,
                logoUrl: document.getElementById('logo').value,
                footerText: document.getElementById('footer').value,
                apiKeys: document.getElementById('keys').value.split('\n').filter(k => k.trim()),
                announcement: document.getElementById('ann').value,
                showAnnouncement: document.getElementById('sAnn').value === "true",
                maintenance: document.getElementById('maint').value === "true",
                adTop: document.getElementById('adT').value,
                adBottom: document.getElementById('adB').value
            };
            const res = await fetch('/api/admin/config', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ password: p, action: 'update', data }) });
            if(res.ok) alert("Synchronized with Database!");
        }
    </script>
</body>
</html>
