<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>System Control | Master Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; color: white; }
        .box { background: #0f172a; border: 1px solid #1e293b; padding: 25px; border-radius: 20px; }
        input, textarea, select { background: #1e293b; border: 1px solid #334155; padding: 12px; border-radius: 10px; width: 100%; color: white; margin-top: 5px; outline: none; }
        input:focus { border-color: #10b981; }
        label { font-size: 11px; color: #64748b; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body class="p-6 pb-20">
    <div id="login" class="max-w-md mx-auto mt-20 box text-center">
        <h1 class="text-2xl font-bold mb-4 text-emerald-500 uppercase">Admin Vault</h1>
        <input type="password" id="pass" placeholder="Password" class="mb-4 text-center">
        <button onclick="login()" class="w-full bg-emerald-500 text-black font-bold py-4 rounded-xl">OPEN HUB</button>
    </div>

    <div id="dash" class="hidden max-w-5xl mx-auto space-y-6">
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-bold uppercase tracking-tighter">Master <span class="text-emerald-500">Dashboard</span></h1>
            <button onclick="save()" class="bg-emerald-500 text-black px-12 py-4 rounded-xl font-bold">SAVE ALL CONFIG</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Identity -->
            <div class="box space-y-4 border-t-4 border-emerald-500">
                <h3 class="font-bold text-emerald-500 text-xs uppercase">Branding</h3>
                <div><label>Site Name</label><input type="text" id="siteName"></div>
                <div><label>Site Description</label><input type="text" id="desc"></div>
                <div><label>Logo Image Link</label><input type="text" id="logo"></div>
                <div><label>Footer Text</label><input type="text" id="footer"></div>
            </div>

            <!-- API & Security -->
            <div class="box space-y-4 border-t-4 border-blue-500">
                <h3 class="font-bold text-blue-500 text-xs uppercase">System Configuration</h3>
                <div><label>API Keys (One Per Line)</label><textarea id="keys" rows="4"></textarea></div>
                <div><label>Maintenance Mode</label><select id="maint"><option value="false">OFF (Normal Mode)</option><option value="true">ON (System Blocked)</option></select></div>
            </div>

            <!-- News -->
            <div class="box md:col-span-2 space-y-4 border-t-4 border-purple-500">
                <h3 class="font-bold text-purple-500 text-xs uppercase">Announcement Board</h3>
                <div><label>Announcement Message</label><input type="text" id="ann"></div>
                <div><label>Visibility Status
